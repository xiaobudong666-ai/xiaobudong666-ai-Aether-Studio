name: M12 DENY-ONLY API regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/app/main.py"
      - "apps/api/test_generation_tasks.py"
      - ".github/workflows/m12-deny-only.yml"
  push:
    branches:
      - "fix/m12-generated-export-deny-only-20261104"

permissions:
  contents: read

concurrency:
  group: m12-deny-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m12-api-regression:
    name: M12 DENY-ONLY API regression (SQLite / no real Provider)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: apps/api
      AETHER_GENERATION_PROVIDER_MODE: disabled
      AETHER_FAKE_ONLY_NONPROD: "false"
      AETHER_RUNTIME_STAGE: nonproduction
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run API regression suite
        run: |
          python -m pytest \
            apps/api/test_main.py \
            apps/api/test_moneyprinter.py \
            apps/api/test_generation_tasks.py \
            apps/api/test_runtime_gates.py \
            apps/api/test_detection_evidence.py \
            -v --junitxml=m12-api-regression.xml

      - name: Upload API test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-deny-only-api-regression
          path: m12-api-regression.xml
          if-no-files-found: warn
          retention-days: 14
