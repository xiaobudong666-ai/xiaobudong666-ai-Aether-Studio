name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint checks
        run: pnpm lint

      - name: Compile, type-check, and build
        run: pnpm build

      - name: Run web and package tests
        run: pnpm test

      - name: Audit Node production dependencies
        run: pnpm audit --prod

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install -r apps/video_use/requirements.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r apps/api/requirements.txt
          pip-audit -r apps/worker/requirements.txt
          pip-audit -r apps/video_use/requirements.txt

      - name: Run API tests
        env:
          PYTHONPATH: apps/api
        run: python -m pytest apps/api/test_main.py apps/api/test_moneyprinter.py apps/api/test_generation_tasks.py -v

      - name: Run fake-only private-canary preflight tests
        run: |
          bash -n infra/docker/provider-canary.sh
          python infra/docker/provider-canary-smoke.py self-test

  playwright:
    name: Playwright workbench flow
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable browser-test credential
        run: |
          password="ci-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "AETHER_PLAYWRIGHT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright
        run: pnpm e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Docker Compose integration
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      # Isolate disposable CI resources from local/production Compose projects.
      COMPOSE_PROJECT_NAME: aether-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AETHER_COOKIE_SECURE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable integration credentials
        run: |
          password="ci-$(openssl rand -hex 24)"
          worker_token="ci-$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$worker_token"
          echo "AETHER_BOOTSTRAP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AETHER_WORKER_TOKEN=$worker_token" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/docker-compose.yml config --format json > "$RUNNER_TEMP/base-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "base-compose.json").read_text())
          services = payload["services"]
          networks = payload["networks"]
          assert services["moneyprinter-sidecar"]["networks"] == {
              "provider-control": None, "provider-egress": None,
          }
          assert services["worker"]["networks"] == {
              "aether-net": None, "provider-control": None,
          }
          assert set(services["api"]["networks"]) == {"aether-net"}
          assert set(services["web"]["networks"]) == {"aether-net"}
          assert set(services["video-use"]["networks"]) == {"aether-net"}
          assert networks["provider-control"]["internal"] is True
          assert not services["moneyprinter-sidecar"].get("ports")
          PY

      - name: Validate fake-only canary override and sanitized preflight
        env:
          AETHER_CANARY_LLM_PROVIDER: openai
          AETHER_CANARY_MODEL: fake-ci-model
          AETHER_CANARY_MATERIAL_SOURCE: pexels
          AETHER_CANARY_VOICE_PATH: edge
          AETHER_GENERATION_TENANT_ID: fake-ci-tenant
          AETHER_GENERATION_CONFIG_VERSION_ID: fake-ci-config
          AETHER_GENERATION_POLICY_HASH: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AETHER_CANARY_PROVIDER_BUDGET_EVIDENCE: PRESENT
          AETHER_CANARY_MATERIAL_LICENSE_EVIDENCE: PRESENT
        run: |
          config_file="$RUNNER_TEMP/aether-fake-provider-canary.toml"
          env_file="$RUNNER_TEMP/aether-fake-provider-canary.env"
          printf '%s\n' \
            'log_level = "WARNING"' \
            '[app]' \
            'video_source = "pexels"' \
            'hide_config = true' \
            'pexels_api_keys = ["fake-ci-material-key"]' \
            'pixabay_api_keys = []' \
            'llm_provider = "openai"' \
            'openai_api_key = "fake-ci-llm-key"' \
            'openai_model_name = "fake-ci-model"' \
            'moonshot_api_key = ""' \
            'moonshot_model_name = ""' \
            'qwen_api_key = ""' \
            'qwen_model_name = ""' \
            'deepseek_api_key = ""' \
            'deepseek_model_name = ""' \
            'gemini_api_key = ""' \
            'gemini_model_name = ""' \
            'minimax_api_key = ""' \
            'minimax_model_name = ""' \
            'modelscope_api_key = ""' \
            'modelscope_model_name = ""' \
            'pollinations_api_key = ""' \
            'upload_post_api_key = ""' \
            'subtitle_provider = "edge"' \
            'endpoint = ""' \
            'material_directory = "task"' \
            'enable_redis = false' \
            'max_concurrent_tasks = 1' \
            'upload_post_enabled = false' \
            'upload_post_auto_upload = false' \
            '[proxy]' \
            '[azure]' \
            '[siliconflow]' > "$config_file"
          printf '%s\n' \
            'AETHER_GENERATION_PROVIDER_MODE=disabled' \
            'AETHER_GENERATION_CREDENTIAL_STATE=ABSENT' \
            'AETHER_GENERATION_NETWORK_ISOLATION=NOT_ENFORCED' \
            'AETHER_GENERATION_CANARY_PROFILE=disabled' > "$env_file"
          chmod 600 "$config_file" "$env_file"
          MONEYPRINTER_CONFIG_FILE="$config_file" \
          AETHER_CANARY_ENV_FILE="$env_file" \
          infra/docker/provider-canary.sh preflight --approved-sha "$(git rev-parse HEAD)" \
            > "$RUNNER_TEMP/provider-canary-preflight.json"
          python infra/docker/provider-canary-smoke.py scan-evidence \
            --evidence-file "$RUNNER_TEMP/provider-canary-preflight.json"
          MONEYPRINTER_CONFIG_FILE="$config_file" docker compose \
            --env-file "$env_file" \
            -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.provider-canary.yml \
            config --format json > "$RUNNER_TEMP/canary-compose.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "canary-compose.json").read_text())
          sidecar = payload["services"]["moneyprinter-sidecar"]
          worker = payload["services"]["worker"]
          mount = next(item for item in sidecar["volumes"] if item["target"] == "/MoneyPrinterTurbo/config.toml")
          assert mount["type"] == "bind" and mount["read_only"] is True
          assert not sidecar.get("ports")
          assert worker["environment"]["AETHER_GENERATION_CREDENTIAL_STATE"] == "PRESENT"
          assert worker["environment"]["AETHER_GENERATION_NETWORK_ISOLATION"] == "ENFORCED"
          assert worker["environment"]["AETHER_GENERATION_CANARY_PROFILE"] == "private-one-task-v1"
          serialized = json.dumps(payload).lower()
          assert "fake-ci-llm-key" not in serialized
          assert "fake-ci-material-key" not in serialized
          PY

      - name: Build images
        run: docker compose -f infra/docker/docker-compose.yml build

      - name: Prove target config bind is read-only without Provider egress
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$RUNNER_TEMP/aether-fake-provider-canary.toml,target=/MoneyPrinterTurbo/config.toml,readonly" \
            --entrypoint python moneyprinterturbo:v1.2.7-475f21147f0808 \
            -c $'from pathlib import Path\np=Path("/MoneyPrinterTurbo/config.toml")\nassert p.is_file()\ntry:\n    p.open("a").write("x")\nexcept OSError:\n    pass\nelse:\n    raise SystemExit("read-only bind accepted a write")'

      - name: Start healthy stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --wait --wait-timeout 300
          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8001/health
          curl --fail --show-error http://127.0.0.1/healthz
          curl --fail --show-error http://127.0.0.1/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/api/moneyprinter/health)" = "410"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/api/moneyprinter/capabilities)" = "410"
          curl --fail --show-error http://127.0.0.1/api/video-use/health
          curl --fail --show-error http://127.0.0.1/api/video-use/capabilities
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1/api/internal/render-tasks/claim)" = "404"

      - name: Internal same-origin networking validation
        run: |
          # 1. API, Web and video-use cannot resolve/connect to the unauthenticated Sidecar.
          docker compose -f infra/docker/docker-compose.yml exec -T api python -c $'import urllib.request\ntry:\n    urllib.request.urlopen("http://moneyprinter-sidecar:8080/openapi.json", timeout=2)\nexcept Exception:\n    pass\nelse:\n    raise SystemExit("API reached Provider Sidecar")'
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python -c $'import urllib.request\ntry:\n    urllib.request.urlopen("http://moneyprinter-sidecar:8080/openapi.json", timeout=2)\nexcept Exception:\n    pass\nelse:\n    raise SystemExit("video-use reached Provider Sidecar")'
          docker compose -f infra/docker/docker-compose.yml exec -T web sh -c "if wget -q -T 2 -O /dev/null http://moneyprinter-sidecar:8080/openapi.json; then exit 1; fi"
          # 2. Worker alone can probe the Sidecar through provider-control.
          docker compose -f infra/docker/docker-compose.yml exec -T worker python -c "import urllib.request; urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=5)"
          # 3. Assert the pinned v1.2.7 API schema from Worker only.
          docker compose -f infra/docker/docker-compose.yml exec -T worker python -c "import urllib.request, json; \
            data = json.loads(urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json').read().decode()); \
            assert '/api/v1/videos' in data['paths'], 'Missing contract: POST /api/v1/videos'; \
            assert '/api/v1/tasks/{task_id}' in data['paths'], 'Missing contract: GET /api/v1/tasks/{task_id}'"

      - name: Verify FFmpeg and ffprobe in Worker
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffmpeg -version
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffprobe -version

      - name: Run Worker tests in FFmpeg container
        run: |
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_worker.py worker:/tmp/test_worker.py
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_moneyprinter.py worker:/tmp/test_moneyprinter.py
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_generation_tasks.py worker:/tmp/test_generation_tasks.py
          docker compose -f infra/docker/docker-compose.yml exec -T \
            -e PYTHONPATH=/app worker \
            python -m pytest /tmp/test_worker.py /tmp/test_moneyprinter.py /tmp/test_generation_tasks.py -v

      - name: Run video-use sidecar tests in FFmpeg container
        run: |
          docker compose -f infra/docker/docker-compose.yml cp apps/video_use/test_main.py video-use:/tmp/test_main.py
          docker compose -f infra/docker/docker-compose.yml exec -T video-use \
            python -m pytest /tmp/test_main.py -v

      - name: Verify pinned video-use and execute a real render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python -c "import app.main as m; assert m.UPSTREAM_COMMIT == '92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66'"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use sh -c "mkdir -p /media/projects/ci/media && ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /media/projects/ci/media/ci-source.mp4"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python /service/ci_smoke.py

      - name: Verify authenticated upload, persistent queue, Worker, and canonical gap render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T \
            -e AETHER_SMOKE_EMAIL=admin@aether.local \
            -e AETHER_SMOKE_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD" \
            -e AETHER_SMOKE_BASE_URL=http://web/api \
            worker python /app/authenticated-smoke.py

      - name: Setup Node.js 24 for full-browser production flow
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3 for full-browser production flow
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Generate a real browser upload fixture
        run: |
          mkdir -p e2e/fixtures
          docker compose -f infra/docker/docker-compose.yml exec -T video-use \
            ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart \
            /tmp/browser-real.mp4
          docker compose -f infra/docker/docker-compose.yml cp \
            video-use:/tmp/browser-real.mp4 e2e/fixtures/browser-real.mp4

      - name: Run real browser upload-to-download flow
        env:
          AETHER_PRODUCTION_E2E: "1"
          AETHER_PRODUCTION_E2E_URL: http://127.0.0.1
          AETHER_PRODUCTION_E2E_EMAIL: admin@aether.local
        run: |
          export AETHER_PRODUCTION_E2E_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD"
          pnpm exec playwright test --config=playwright.production.config.ts

      - name: Capture Docker logs
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color > docker-compose.log

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-evidence
          path: docker-compose.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload real browser production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable CI stack and its run-scoped volumes
        if: always()
        # --volumes is safe only because COMPOSE_PROJECT_NAME is unique to this CI run.
        run: docker compose -f infra/docker/docker-compose.yml down --volumes
