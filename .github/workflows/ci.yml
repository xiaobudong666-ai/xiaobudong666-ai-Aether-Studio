name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint checks
        run: pnpm lint

      - name: Compile, type-check, and build
        run: pnpm build

      - name: Run web and package tests
        run: pnpm test

      - name: Audit Node production dependencies
        run: pnpm audit --prod

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install -r apps/video_use/requirements.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r apps/api/requirements.txt
          pip-audit -r apps/worker/requirements.txt
          pip-audit -r apps/video_use/requirements.txt

      - name: Run API tests
        env:
          PYTHONPATH: apps/api
        run: python -m pytest apps/api/test_main.py apps/api/test_moneyprinter.py apps/api/test_generation_tasks.py -v

      - name: Run fake-only Provider canary acceptance suite
        run: python infra/docker/provider-canary-smoke.py self-test --repo-root "$GITHUB_WORKSPACE"

  playwright:
    name: Playwright workbench flow
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable browser-test credential
        run: |
          password="ci-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "AETHER_PLAYWRIGHT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright
        run: pnpm e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Docker Compose integration
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: aether-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AETHER_COOKIE_SECURE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable integration credentials
        run: |
          password="ci-$(openssl rand -hex 24)"
          worker_token="ci-$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$worker_token"
          echo "AETHER_BOOTSTRAP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AETHER_WORKER_TOKEN=$worker_token" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Create fake-only canary fixtures and validate override
        run: |
          mkdir -p /tmp/aether-fake-canary
          cat >/tmp/aether-fake-canary/config.toml <<'EOF'
          [app]
          llm_provider = "openai"
          openai_api_key = "fake-ci-key"
          openai_model_name = "fake-model"
          openai_base_url = ""
          video_source = "pexels"
          pexels_api_keys = ["fake-ci-material"]
          pixabay_api_keys = []
          endpoint = ""
          material_directory = "task"
          enable_redis = false
          max_concurrent_tasks = 1
          hide_config = true
          [proxy]
          [ui]
          upload_post_enabled = false
          upload_post_auto_upload = false
          [azure]
          speech_key = ""
          speech_region = ""
          [siliconflow]
          api_key = ""
          EOF
          chmod 600 /tmp/aether-fake-canary/config.toml
          cat >/tmp/aether-fake-canary/policy.json <<'EOF'
          {"tenantId":"tenant-ci","configVersionId":"config-ci","policyHash":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","artifactPathPrefixes":["/tasks/"],"concurrentTaskLimit":1,"monthlyRequestLimit":1,"monthlyGeneratedSecondsLimit":10,"maxOutputs":1}
          EOF
          printf '%s\n' '{"hardLimit":"fake-only"}' >/tmp/aether-fake-canary/limit.json
          printf '%s\n' '{"license":"fake-only"}' >/tmp/aether-fake-canary/license.json
          MONEYPRINTER_CONFIG_FILE=/tmp/aether-fake-canary/config.toml \
          AETHER_GENERATION_CREDENTIAL_STATE=PRESENT \
          AETHER_GENERATION_NETWORK_ISOLATION=ENFORCED \
          AETHER_GENERATION_CANARY_PROFILE=private-single-task-v1 \
          docker compose -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.provider-canary.yml config --quiet
          python infra/docker/provider-canary-smoke.py preflight \
            --config /tmp/aether-fake-canary/config.toml \
            --repo-root "$GITHUB_WORKSPACE" \
            --policy-file /tmp/aether-fake-canary/policy.json \
            --tenant-id tenant-ci --config-version-id config-ci \
            --policy-hash aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --provider openai --model fake-model --material-source pexels --voice-path edge \
            --log-level WARNING \
            >/tmp/aether-fake-canary/preflight.json
          grep -q '"credentialState": "PRESENT"' /tmp/aether-fake-canary/preflight.json

      - name: Build images
        run: docker compose -f infra/docker/docker-compose.yml build

      - name: Start healthy stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --wait --wait-timeout 300
          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8001/health
          curl --fail --show-error http://127.0.0.1/healthz
          curl --fail --show-error http://127.0.0.1/api/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/api/moneyprinter/health)" = "410"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1/api/moneyprinter/capabilities)" = "410"
          curl --fail --show-error http://127.0.0.1/api/video-use/health
          curl --fail --show-error http://127.0.0.1/api/video-use/capabilities
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1/api/internal/render-tasks/claim)" = "404"

      - name: Internal Provider networking validation
        run: |
          echo "API cannot reach MoneyPrinter Sidecar"
          ! docker compose -f infra/docker/docker-compose.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=3)"
          echo "Web and video-use cannot reach MoneyPrinter Sidecar"
          ! docker compose -f infra/docker/docker-compose.yml exec -T video-use python -c "import urllib.request; urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=3)"
          ! docker compose -f infra/docker/docker-compose.yml exec -T web wget -q -O - http://moneyprinter-sidecar:8080/openapi.json
          echo "Worker reaches MoneyPrinter Sidecar through provider-control"
          docker compose -f infra/docker/docker-compose.yml exec -T worker python -c "import urllib.request, json; data=json.loads(urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=5).read().decode()); assert '/api/v1/videos' in data['paths']; assert '/api/v1/tasks/{task_id}' in data['paths']"

      - name: Verify FFmpeg and ffprobe in Worker
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffmpeg -version
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffprobe -version

      - name: Run Worker tests in FFmpeg container
        run: |
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_worker.py worker:/tmp/test_worker.py
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_moneyprinter.py worker:/tmp/test_moneyprinter.py
          docker compose -f infra/docker/docker-compose.yml cp apps/worker/test_generation_tasks.py worker:/tmp/test_generation_tasks.py
          docker compose -f infra/docker/docker-compose.yml exec -T -e PYTHONPATH=/app worker python -m pytest /tmp/test_worker.py /tmp/test_moneyprinter.py /tmp/test_generation_tasks.py -v

      - name: Run video-use sidecar tests in FFmpeg container
        run: |
          docker compose -f infra/docker/docker-compose.yml cp apps/video_use/test_main.py video-use:/tmp/test_main.py
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python -m pytest /tmp/test_main.py -v

      - name: Verify pinned video-use and execute a real render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python -c "import app.main as m; assert m.UPSTREAM_COMMIT == '92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66'"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use sh -c "mkdir -p /media/projects/ci/media && ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /media/projects/ci/media/ci-source.mp4"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python /service/ci_smoke.py

      - name: Verify authenticated upload, persistent queue, Worker, and canonical gap render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T \
            -e AETHER_SMOKE_EMAIL=admin@aether.local \
            -e AETHER_SMOKE_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD" \
            -e AETHER_SMOKE_BASE_URL=http://web/api \
            worker python /app/authenticated-smoke.py

      - name: Setup Node.js 24 for full-browser production flow
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3 for full-browser production flow
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Generate a real browser upload fixture
        run: |
          mkdir -p e2e/fixtures
          docker compose -f infra/docker/docker-compose.yml exec -T video-use \
            ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart \
            /tmp/browser-real.mp4
          docker compose -f infra/docker/docker-compose.yml cp video-use:/tmp/browser-real.mp4 e2e/fixtures/browser-real.mp4

      - name: Run real browser upload-to-download flow
        env:
          AETHER_PRODUCTION_E2E: "1"
          AETHER_PRODUCTION_E2E_URL: http://127.0.0.1
          AETHER_PRODUCTION_E2E_EMAIL: admin@aether.local
        run: |
          export AETHER_PRODUCTION_E2E_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD"
          pnpm exec playwright test --config=playwright.production.config.ts

      - name: Capture Docker logs
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color > docker-compose.log

      - name: Sanitize fake canary logs
        if: always()
        run: |
          ! grep -Eiq '(api[_-]?key|authorization:|cookie:|bearer[[:space:]]+[A-Za-z0-9._-]{8,}|fake-ci-key|fake-ci-material)' docker-compose.log
          rm -rf /tmp/aether-fake-canary

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-evidence
          path: docker-compose.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload real browser production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable CI stack and its run-scoped volumes
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes
