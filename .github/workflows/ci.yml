name: CI Pipeline

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint checks
        run: pnpm lint

      - name: Compile, type-check, and build
        run: pnpm build

      - name: Run web and package tests
        run: pnpm test

      - name: Audit Node production dependencies
        run: pnpm audit --prod

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.0
          pip install -r apps/api/requirements.txt
          pip install -r apps/worker/requirements.txt
          pip install -r apps/video_use/requirements.txt

      - name: Audit Python dependencies
        run: |
          pip-audit -r apps/api/requirements.txt
          pip-audit -r apps/worker/requirements.txt
          pip-audit -r apps/video_use/requirements.txt

      - name: Install FFmpeg test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run API tests
        env:
          PYTHONPATH: apps/api
        run: python -m pytest apps/api/test_main.py apps/api/test_moneyprinter.py -v

      - name: Run Worker tests
        env:
          PYTHONPATH: apps/worker
        run: python -m pytest apps/worker/test_worker.py apps/worker/test_moneyprinter.py -v

      - name: Run video-use sidecar tests
        env:
          PYTHONPATH: apps/video_use
        run: python -m pytest apps/video_use/test_main.py -v

  playwright:
    name: Playwright workbench flow
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable browser-test credential
        run: |
          password="ci-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "AETHER_PLAYWRIGHT_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  docker-integration:
    name: Docker Compose integration
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      # Isolate disposable CI resources from local/production Compose projects.
      COMPOSE_PROJECT_NAME: aether-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AETHER_COOKIE_SECURE: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate disposable integration credentials
        run: |
          password="ci-$(openssl rand -hex 24)"
          worker_token="ci-$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$worker_token"
          echo "AETHER_BOOTSTRAP_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "AETHER_WORKER_TOKEN=$worker_token" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/docker-compose.yml config --quiet

      - name: Build images
        run: docker compose -f infra/docker/docker-compose.yml build

      - name: Start healthy stack
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d --wait --wait-timeout 300
          curl --fail --show-error http://127.0.0.1:8000/health
          curl --fail --show-error http://127.0.0.1:8001/health
          curl --fail --show-error http://127.0.0.1/healthz
          curl --fail --show-error http://127.0.0.1/api/health
          curl --fail --show-error http://127.0.0.1/api/moneyprinter/health
          curl --fail --show-error http://127.0.0.1/api/moneyprinter/capabilities
          curl --fail --show-error http://127.0.0.1/api/video-use/health
          curl --fail --show-error http://127.0.0.1/api/video-use/capabilities
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1/api/internal/render-tasks/claim)" = "404"

      - name: Internal same-origin networking validation
        run: |
          # 1. Probe sidecar openapi directly from inside API container
          docker compose -f infra/docker/docker-compose.yml exec -T api python -c "import urllib.request; urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=5)"
          # 2. Probe sidecar openapi directly from inside Worker container
          docker compose -f infra/docker/docker-compose.yml exec -T worker python -c "import urllib.request; urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json', timeout=5)"
          # 3. Assert sidecar has correct v1.2.7 API schema contracts: POST /api/v1/videos and GET /api/v1/tasks/{task_id}
          docker compose -f infra/docker/docker-compose.yml exec -T api python -c "import urllib.request, json; \
            data = json.loads(urllib.request.urlopen('http://moneyprinter-sidecar:8080/openapi.json').read().decode()); \
            assert '/api/v1/videos' in data['paths'], 'Missing contract: POST /api/v1/videos'; \
            assert '/api/v1/tasks/{task_id}' in data['paths'], 'Missing contract: GET /api/v1/tasks/{task_id}'"

      - name: Verify FFmpeg and ffprobe in Worker
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffmpeg -version
          docker compose -f infra/docker/docker-compose.yml exec -T worker ffprobe -version

      - name: Verify pinned video-use and execute a real render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python -c "import app.main as m; assert m.UPSTREAM_COMMIT == '92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66'"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use sh -c "mkdir -p /media/projects/ci/media && ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest /media/projects/ci/media/ci-source.mp4"
          docker compose -f infra/docker/docker-compose.yml exec -T video-use python /service/ci_smoke.py

      - name: Verify authenticated upload, persistent queue, Worker, and canonical gap render
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T \
            -e AETHER_SMOKE_EMAIL=admin@aether.local \
            -e AETHER_SMOKE_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD" \
            -e AETHER_SMOKE_BASE_URL=http://web/api \
            worker python /app/authenticated-smoke.py

      - name: Setup Node.js 24 for full-browser production flow
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm 10.30.3 for full-browser production flow
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install browser test dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Generate a real browser upload fixture
        run: |
          mkdir -p e2e/fixtures
          docker compose -f infra/docker/docker-compose.yml exec -T video-use \
            ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 \
            -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart \
            /tmp/browser-real.mp4
          docker compose -f infra/docker/docker-compose.yml cp \
            video-use:/tmp/browser-real.mp4 e2e/fixtures/browser-real.mp4

      - name: Run real browser upload-to-download flow
        env:
          AETHER_PRODUCTION_E2E: "1"
          AETHER_PRODUCTION_E2E_URL: http://127.0.0.1
          AETHER_PRODUCTION_E2E_EMAIL: admin@aether.local
        run: |
          export AETHER_PRODUCTION_E2E_PASSWORD="$AETHER_BOOTSTRAP_ADMIN_PASSWORD"
          pnpm exec playwright test --config=playwright.production.config.ts

      - name: Capture Docker logs
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml logs --no-color > docker-compose.log

      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-evidence
          path: docker-compose.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload real browser production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence
          path: |
            playwright-report-production/
            test-results-production/
          if-no-files-found: error
          retention-days: 14

      - name: Stop disposable CI stack and its run-scoped volumes
        if: always()
        # --volumes is safe only because COMPOSE_PROJECT_NAME is unique to this CI run.
        run: docker compose -f infra/docker/docker-compose.yml down --volumes
