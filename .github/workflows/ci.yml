name: CI Pipeline

on:
  push:
    branches:
      - "main"
      - "feat/**"
  pull_request:
    branches:
      - "main"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Node Setup (Node 24 LTS)
    - name: Setup Node.js (24 LTS)
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10.30.3

    # Install using --frozen-lockfile for deterministic deployments
    - name: Install Node Dependencies
      run: pnpm install --frozen-lockfile

    # Sequence: Install -> Lint -> Type Check -> Test -> Build
    - name: Run ESLint Checks
      run: pnpm lint

    - name: Compile and Type Check
      run: pnpm build

    - name: Run Web and Package Tests
      run: pnpm test

    # Python Setup & Checks
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install API Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt

    - name: Run API Tests
      run: |
        pytest apps/api/test_main.py

    - name: Install Worker Dependencies
      run: |
        pip install -r apps/worker/requirements.txt

    - name: Run Worker Tests
      run: |
        pytest apps/worker/test_worker.py
