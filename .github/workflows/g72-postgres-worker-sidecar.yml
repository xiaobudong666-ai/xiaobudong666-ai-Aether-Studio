name: G72 PostgreSQL Worker Sidecar FAKE-only integration

on:
  push:
    branches:
      - feat/fusion-m0-g72-media-auth-negative-20261025
    paths:
      - infra/docker/api.g72-postgres-ci.Dockerfile
      - infra/docker/docker-compose.g72-postgres-ci.override.yml
      - infra/docker/docker-compose.g72-fake-only.override.yml
      - infra/docker/g72-compose-network-smoke.py
      - infra/docker/g72-pg-native-worker-lock-race-smoke.py
      - infra/docker/g72-midupload-revocation-smoke.py
      - .github/workflows/g72-postgres-worker-sidecar.yml
      - apps/api/app/**
      - apps/worker/app/**

permissions:
  contents: read

jobs:
  g72-postgres-worker-sidecar:
    # Nonproduction FAKE-only evidence; NOT real Provider, M12, or release.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: aether-g72pg-${{ github.run_id }}-${{ github.run_attempt }}
      AETHER_COOKIE_SECURE: "false"
      AETHER_API_PORT: "18300"
      AETHER_WORKER_PORT: "18301"
    steps:
      - name: Checkout exact isolated branch SHA
        uses: actions/checkout@v4

      - name: Generate disposable Owner and Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          owner_password="ci-$(openssl rand -hex 24)"
          worker_token="ci-$(openssl rand -hex 32)"
          echo "::add-mask::$owner_password"
          echo "::add-mask::$worker_token"
          echo "AETHER_BOOTSTRAP_ADMIN_PASSWORD=$owner_password" >> "$GITHUB_ENV"
          echo "AETHER_WORKER_TOKEN=$worker_token" >> "$GITHUB_ENV"

      - name: Fail closed unless isolated PostgreSQL and fake-only settings
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            config --format json > "$RUNNER_TEMP/g72-pg-config.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          services = json.loads(Path(os.environ["RUNNER_TEMP"], "g72-pg-config.json").read_text())["services"]
          api, worker, sidecar, pg = (services[n] for n in ("api", "worker", "video-use", "postgres-g72"))
          assert api["environment"]["DATABASE_URL"] == (
              "postgresql+psycopg://ci_g72:ci-only-postgres-password@postgres-g72:5432/aether_g72_ci"
          )
          assert api["build"]["dockerfile"] == "infra/docker/api.g72-postgres-ci.Dockerfile"
          assert api["environment"]["AETHER_FAKE_ONLY_NONPROD"] == "true"
          assert api["environment"]["AETHER_RUNTIME_STAGE"] == "nonproduction"
          assert api["environment"]["AETHER_GENERATION_PROVIDER_MODE"] == "deterministic-fake"
          assert not worker.get("ports"), "FAKE-only dual Worker test must not publish health ports"
          assert worker["environment"]["AETHER_GENERATION_PROVIDER_MODE"] == "deterministic-fake"
          assert worker["environment"]["AETHER_TALKING_HEAD_MODE"] == "disabled"
          assert worker["environment"]["AETHER_GENERATION_CREDENTIAL_STATE"] == "ABSENT"
          assert worker["environment"]["AETHER_GENERATION_CANARY_PROFILE"] == "disabled"
          assert sidecar["environment"]["AETHER_FAKE_ONLY_NONPROD"] == "true"
          assert not pg.get("ports") and set(pg["networks"]) == {"aether-net"}
          assert pg["environment"]["POSTGRES_DB"] == "aether_g72_ci"
          assert set(api["networks"]) == {"aether-net"}
          assert not api["environment"].get("HEYGEN_API_KEY")
          PY

      - name: Build and start real API Worker Sidecar with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            up -d --build --wait --wait-timeout 420 --scale worker=2 api worker video-use
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            cp infra/docker/g72-compose-network-smoke.py api:/tmp/g72-compose-network-smoke.py

      - name: Verify two real Worker replicas healthy before submitting FAKE task
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t worker_ids < <(docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            ps -q worker)
          if [ "${#worker_ids[@]}" -ne 2 ]; then
            printf 'Expected 2 running Workers, got %s\\n' "${#worker_ids[@]}" >&2
            exit 1
          fi
          for worker_id in "${worker_ids[@]}"; do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$worker_id")"
            test "$health" = healthy || { echo "FAKE Worker unhealthy: $health" >&2; exit 1; }
          done
          echo "G72_PG_DUAL_REAL_WORKER_HEALTHY count=2"

      - name: Verify API connected to real disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -T api python - <<'PY'
          import os
          from sqlalchemy import text
          from app.database import engine
          assert os.environ["AETHER_FAKE_ONLY_NONPROD"] == "true"
          assert os.environ["AETHER_RUNTIME_STAGE"] == "nonproduction"
          assert engine.dialect.name == "postgresql"
          with engine.connect() as db:
              assert db.scalar(text("SELECT current_database()")) == "aether_g72_ci"
              assert int(db.scalar(text("SHOW server_version_num"))) >= 160000
          print("G72_PG_API_CONNECTION_PASS", flush=True)
          PY

      - name: Real Worker to Sidecar media and database receipts
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -T api python /tmp/g72-compose-network-smoke.py prepare

      - name: Restart real Worker and Sidecar then verify immutable media and auth
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            restart video-use worker
          sleep 12
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -T api python /tmp/g72-compose-network-smoke.py verify

      - name: Stop both real Workers for deterministic post-ACK PostgreSQL rights fault
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            stop worker
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -T video-use ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc=size=320x240:rate=12 -t 3 \
            -c:v mpeg4 -pix_fmt yuv420p -movflags +faststart \
            /tmp/g72-midupload-ci.mp4
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            cp video-use:/tmp/g72-midupload-ci.mp4 "$RUNNER_TEMP/g72-midupload-ci.mp4"
          test "$(stat -c%s "$RUNNER_TEMP/g72-midupload-ci.mp4")" -gt 1000 \
            || { echo "synthetic MP4 too small to satisfy native smoke input guard" >&2; exit 1; }
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            cp "$RUNNER_TEMP/g72-midupload-ci.mp4" api:/tmp/g72-midupload-ci.mp4
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            cp infra/docker/g72-midupload-revocation-smoke.py api:/tmp/g72-midupload-revocation-smoke.py

      - name: PostgreSQL API-to-real-Sidecar post-ACK synthetic revocation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -e G72_PG_POSTACK_INJECTION=true -T api \
            python /tmp/g72-midupload-revocation-smoke.py prepare

      - name: Restart real Sidecar and two Workers and prove held media immutable
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            restart video-use
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            up -d --wait --wait-timeout 240 --scale worker=2 worker video-use
          sleep 8
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            exec -e G72_PG_POSTACK_INJECTION=true -T api \
            python /tmp/g72-midupload-revocation-smoke.py verify

      - name: Force two native Worker containers through one PostgreSQL table-lock barrier
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose -f infra/docker/docker-compose.yml \
              -f infra/docker/docker-compose.g72-fake-only.override.yml \
              -f infra/docker/docker-compose.g72-postgres-ci.override.yml "$@"
          }
          # Pause only the ordinary daemon replicas; the two native Worker
          # clients below use separate disposable Worker service containers.
          compose stop worker
          compose cp infra/docker/g72-pg-native-worker-lock-race-smoke.py \
            api:/tmp/g72-pg-native-worker-lock-race-smoke.py
          compose exec -T api python /tmp/g72-pg-native-worker-lock-race-smoke.py submit
          compose exec -T api python /tmp/g72-pg-native-worker-lock-race-smoke.py lock \
            > "$RUNNER_TEMP/g72-pg-lock-race.log" 2>&1 &
          lock_pid=$!
          ready=false
          for i in $(seq 1 150); do
            if grep -q G72_PG_LOCK_RACE_LOCK_HELD "$RUNNER_TEMP/g72-pg-lock-race.log"; then
              ready=true
              break
            fi
            if ! kill -0 "$lock_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/g72-pg-lock-race.log"
              exit 1
            fi
            sleep .2
          done
          test "$ready" = true || { echo "PG lock barrier not armed" >&2; exit 1; }
          compose run --rm --no-deps -T -e AETHER_WORKER_ID=g72-ci-lock-race-a \
            worker python - > "$RUNNER_TEMP/g72-pg-native-a.log" 2>&1 <<'PY' &
          import json, os
          from app.main import initialize_worker, process_generation_task
          assert os.environ["AETHER_GENERATION_PROVIDER_MODE"] == "deterministic-fake"
          assert os.environ["AETHER_TALKING_HEAD_MODE"] == "disabled"
          assert os.environ["AETHER_GENERATION_CREDENTIAL_STATE"] == "ABSENT"
          c = initialize_worker()
          print("G72_NATIVE_READY_A", flush=True)
          job = c.generation_queue.claim()
          print("G72_NATIVE_CLAIM_RESULT " + json.dumps({
              "worker": "A", "claimed": bool(job),
              "taskId": job.get("taskId") if job else None,
          }), flush=True)
          if job is not None:
              result = process_generation_task(c, job, poll_interval=.2)
              print("G72_NATIVE_PROCESS_RESULT " + str(result.get("status")), flush=True)
          PY
          a_pid=$!
          compose run --rm --no-deps -T -e AETHER_WORKER_ID=g72-ci-lock-race-b \
            worker python - > "$RUNNER_TEMP/g72-pg-native-b.log" 2>&1 <<'PY' &
          import json, os
          from app.main import initialize_worker, process_generation_task
          assert os.environ["AETHER_GENERATION_PROVIDER_MODE"] == "deterministic-fake"
          assert os.environ["AETHER_TALKING_HEAD_MODE"] == "disabled"
          assert os.environ["AETHER_GENERATION_CREDENTIAL_STATE"] == "ABSENT"
          c = initialize_worker()
          print("G72_NATIVE_READY_B", flush=True)
          job = c.generation_queue.claim()
          print("G72_NATIVE_CLAIM_RESULT " + json.dumps({
              "worker": "B", "claimed": bool(job),
              "taskId": job.get("taskId") if job else None,
          }), flush=True)
          if job is not None:
              result = process_generation_task(c, job, poll_interval=.2)
              print("G72_NATIVE_PROCESS_RESULT " + str(result.get("status")), flush=True)
          PY
          b_pid=$!
          wait "$lock_pid"
          wait "$a_pid"
          wait "$b_pid"
          grep -q G72_PG_LOCK_RACE_TWO_CLAIMS_WAITING "$RUNNER_TEMP/g72-pg-lock-race.log"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          outcomes = []
          for suffix in ("a", "b"):
              log = (root / f"g72-pg-native-{suffix}.log").read_text()
              rows = [line.split("G72_NATIVE_CLAIM_RESULT ", 1)[1]
                      for line in log.splitlines()
                      if "G72_NATIVE_CLAIM_RESULT " in line]
              assert len(rows) == 1, (suffix, log[-1500:])
              outcomes.append(json.loads(rows[0]))
          assert [x["claimed"] for x in outcomes].count(True) == 1, outcomes
          assert [x["claimed"] for x in outcomes].count(False) == 1, outcomes
          print("G72_PG_NATIVE_DUAL_CLAIM_EXACTLY_ONE_PASS", flush=True)
          PY
          compose exec -T api python /tmp/g72-pg-native-worker-lock-race-smoke.py verify
          compose up -d --wait --wait-timeout 180 --scale worker=2 worker
          compose exec -T api python /tmp/g72-pg-native-worker-lock-race-smoke.py verify

      - name: Nonsecret failure diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            ps || true
          docker compose -f infra/docker/docker-compose.yml \
            -f infra/docker/docker-compose.g72-fake-only.override.yml \
            -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
            logs --tail=80 api worker video-use postgres-g72 2>&1 \
            | sed -E 's/ci-only-postgres-password/[REDACTED]/g' || true

      - name: Destroy the complete disposable stack and database volume
        if: always()
        shell: bash
        run: |
          if [ -n "$COMPOSE_PROJECT_NAME" ]; then
            docker compose -f infra/docker/docker-compose.yml \
              -f infra/docker/docker-compose.g72-fake-only.override.yml \
              -f infra/docker/docker-compose.g72-postgres-ci.override.yml \
              down --volumes --remove-orphans || true
          fi
