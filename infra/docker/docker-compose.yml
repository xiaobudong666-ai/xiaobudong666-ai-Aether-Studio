#
# Upgrade Instructions:
# To upgrade the MoneyPrinterTurbo sidecar:
# 1. Bump the commit SHA in the `build.context` url (e.g. #v1.3.1 or another git commit SHA).
# 2. Re-run local test suite and container verification to check compatibility with adapter.
# ==============================================================================

services:
  moneyprinter-sidecar:
    image: moneyprinterturbo:v1.2.7-475f21147f0808
    build:
      context: https://github.com/harry0703/MoneyPrinterTurbo.git#475f21147f0808f5ffe3f58af9ab794b28a4da2c
    ports:
      - "8080:8080"
      - "8501:8501"
    networks:
      - aether-net
    # Overriding standard Streamlit UI boot command to launch the core API on port 8080
    command: ["python3", "main.py"]
    restart: unless-stopped
    # Fast health check probing the core FastAPI backend openapi contract on port 8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - sqlite-db:/data
    networks:
      - aether-net
    environment:
      - DATABASE_URL=sqlite:////data/aether.db
      - MONEYPRINTER_API_URL=http://moneyprinter-sidecar:8080
    restart: unless-stopped
    depends_on:
      moneyprinter-sidecar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    ports:
      - "8001:8001"
    networks:
      - aether-net
    environment:
      - BACKEND_URL=http://api:8000
      - WORKER_PORT=8001
      - MONEYPRINTER_API_URL=http://moneyprinter-sidecar:8080
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      moneyprinter-sidecar:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "80:80"
    networks:
      - aether-net
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - "http://127.0.0.1/healthz"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  sqlite-db:

networks:
  aether-net:
    driver: bridge
