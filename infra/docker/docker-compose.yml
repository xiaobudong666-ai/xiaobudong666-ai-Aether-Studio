# - Upstream browser-use/video-use is licensed under MIT License and pinned to
#   commit 92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66.
#
# Upgrade Instructions:
# To upgrade the MoneyPrinterTurbo sidecar:
# 1. Bump the commit SHA in the `build.context` url (e.g. #v1.3.1 or another git commit SHA).
# 2. Re-run local test suite and container verification to check compatibility with adapter.
# ==============================================================================

services:
  video-use:
    image: aether-video-use:0.1.0-92c2b34e44c2
    build:
      context: ../..
      dockerfile: infra/docker/video-use.Dockerfile
      args:
        VIDEO_USE_COMMIT: 92c2b34e44c205cbc2acae7f6ca7c1c219d5dd66
    networks:
      - aether-net
    volumes:
      - video-use-media:/media
    environment:
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - VIDEO_USE_MAX_UPLOAD_BYTES=${VIDEO_USE_MAX_UPLOAD_BYTES:-2147483648}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  moneyprinter-sidecar:
    image: moneyprinterturbo:v1.2.7-475f21147f0808
    build:
      context: ../..
      dockerfile: infra/docker/moneyprinter.Dockerfile
      args:
        MONEYPRINTER_COMMIT: 475f21147f0808f5ffe3f58af9ab794b28a4da2c
    networks:
      - aether-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Fast health check probing the core FastAPI backend openapi contract on port 8080
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/openapi.json', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "127.0.0.1:${AETHER_API_PORT:-8000}:8000"
    volumes:
      - sqlite-db:/data
    networks:
      - aether-net
    environment:
      - DATABASE_URL=sqlite:////data/aether.db
      - VIDEO_USE_API_URL=http://video-use:8002
      - AETHER_MAX_UPLOAD_BYTES=${AETHER_MAX_UPLOAD_BYTES:-2147483648}
      - AETHER_BOOTSTRAP_ADMIN_EMAIL=${AETHER_BOOTSTRAP_ADMIN_EMAIL:-admin@aether.local}
      - AETHER_BOOTSTRAP_ADMIN_PASSWORD=${AETHER_BOOTSTRAP_ADMIN_PASSWORD:-}
      - AETHER_BOOTSTRAP_TENANT_NAME=${AETHER_BOOTSTRAP_TENANT_NAME:-Aether Studio}
      - AETHER_PROJECT_QUOTA=${AETHER_PROJECT_QUOTA:-50}
      - AETHER_STORAGE_QUOTA_BYTES=${AETHER_STORAGE_QUOTA_BYTES:-53687091200}
      - AETHER_CONCURRENT_RENDER_QUOTA=${AETHER_CONCURRENT_RENDER_QUOTA:-2}
      - AETHER_MONTHLY_RENDER_SECONDS_QUOTA=${AETHER_MONTHLY_RENDER_SECONDS_QUOTA:-36000}
      - AETHER_WORKER_TOKEN=${AETHER_WORKER_TOKEN:-}
      - AETHER_COOKIE_SECURE=${AETHER_COOKIE_SECURE:-true}
      - AETHER_ENFORCE_CSRF=${AETHER_ENFORCE_CSRF:-true}
      - AETHER_GENERATION_PROVIDER_MODE=${AETHER_GENERATION_PROVIDER_MODE:-disabled}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      moneyprinter-sidecar:
        condition: service_healthy
      video-use:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    ports:
      - "127.0.0.1:${AETHER_WORKER_PORT:-8001}:8001"
    networks:
      - aether-net
    environment:
      - BACKEND_URL=http://api:8000
      - WORKER_PORT=8001
      - MONEYPRINTER_API_URL=http://moneyprinter-sidecar:8080
      - VIDEO_USE_API_URL=http://video-use:8002
      - AETHER_WORKER_TOKEN=${AETHER_WORKER_TOKEN:-}
      - AETHER_RENDER_TIMEOUT_SECONDS=${AETHER_RENDER_TIMEOUT_SECONDS:-3600}
      - AETHER_GENERATION_PROVIDER_MODE=${AETHER_GENERATION_PROVIDER_MODE:-disabled}
      - AETHER_GENERATION_TENANT_ID=${AETHER_GENERATION_TENANT_ID:-}
      - AETHER_GENERATION_CONFIG_VERSION_ID=${AETHER_GENERATION_CONFIG_VERSION_ID:-}
      - AETHER_GENERATION_POLICY_HASH=${AETHER_GENERATION_POLICY_HASH:-}
      - AETHER_GENERATION_MAX_ARTIFACT_BYTES=${AETHER_GENERATION_MAX_ARTIFACT_BYTES:-2147483648}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      moneyprinter-sidecar:
        condition: service_healthy
      video-use:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_OPENREEL_URL: ${VITE_OPENREEL_URL:-}
    ports:
      - "${AETHER_HTTP_BIND:-0.0.0.0}:${AETHER_HTTP_PORT:-80}:80"
    networks:
      - aether-net
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - "http://127.0.0.1/healthz"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  sqlite-db:
  video-use-media:

networks:
  aether-net:
    driver: bridge
